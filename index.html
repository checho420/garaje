<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1B90F5">
<title>Garaje · Control de vehículos</title>

<!-- ══ PWA: manifest, iconos y metadatos de instalación ══ -->
<link rel="manifest" href="%BASE_URL%manifest.json">
<link rel="icon" href="%BASE_URL%icons/icon-192.png">
<link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Garaje">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>

<div class="stage">
  <div class="aside">
    <h1>Garaje</h1>
    <p>Control de vehículos, pensado para el teléfono. Instálala desde el navegador para usarla como app.</p>
  </div>

  <div class="phone">
    <div class="notch"></div>
    <div class="toasts" id="toasts"></div>

    <!-- ─────────── INICIO ─────────── -->
    <main class="screen" id="s-inicio">
      <header class="topbar">
        <div class="hello">
          <div class="sm" id="greetLine">Buenas tardes</div>
          <h2>Tu garaje</h2>
        </div>
        <div class="avatar" id="avatarIn">JD</div>
      </header>
      <div class="car-strip" id="carStripHome"></div>
      <div class="stack" id="homeHero"></div>
      <div class="sec-head"><h3>Registrar</h3></div>
      <div class="quick" id="quickActions"></div>
      <div class="stack" id="homeInsights"></div>
    </main>

    <!-- ─────────── DOCUMENTOS ─────────── -->
    <main class="screen" id="s-docs" hidden>
      <div class="page-title"><h2>Documentos</h2><p id="docsSub">Todos tus vehículos</p></div>
      <div class="stack" id="docsList"></div>
    </main>

    <!-- ─────────── VEHÍCULOS ─────────── -->
    <main class="screen" id="s-cars" hidden>
      <div class="page-title"><h2>Vehículos</h2><p id="carsSub">0 en tu garaje</p></div>
      <div class="stack" id="carsList"></div>
    </main>

    <!-- ─────────── DETALLE DE VEHÍCULO ─────────── -->
    <main class="screen" id="s-vehdetail" hidden>
      <div class="vd-hero" id="vdHero"></div>
      <div class="cat-strip-wrap">
        <button class="cs-arrow left" id="catLeft" aria-label="Ver categorías anteriores">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="cat-strip" id="catStrip"></div>
        <button class="cs-arrow right" id="catRight" aria-label="Ver más categorías">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div id="catPanels"></div>
    </main>

    <!-- ─────────── AJUSTES ─────────── -->
    <main class="screen" id="s-set" hidden>
      <div class="page-title"><h2>Ajustes</h2></div>
      <div style="padding:0 20px" id="setBody"></div>
    </main>

    <!-- ══════════ HOJA GENÉRICA (formularios) ══════════ -->
    <div class="sheet-back" id="sheetBack" onclick="G.closeSheet()"></div>
    <div class="sheet" id="sheet">
      <div class="grab"></div>
      <div id="sheetContent"></div>
    </div>

    <!-- ══════════ BARRA INFERIOR ══════════ -->
    <nav class="tabbar">
      <button class="tab on" data-go="s-inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span class="lb">Inicio</span>
      </button>
      <button class="tab" data-go="s-docs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V6l8-3 8 3z"/></svg>
        <span class="lb">Documentos</span>
      </button>
      <button class="fab" id="fabBtn" aria-label="Registrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="tab" data-go="s-cars">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3v-5l2-5h14l2 5v5h-2"/><circle cx="7.5" cy="17" r="1.9"/><circle cx="16.5" cy="17" r="1.9"/></svg>
        <span class="lb">Vehículos</span>
      </button>
      <button class="tab" data-go="s-set">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
        <span class="lb">Ajustes</span>
      </button>
    </nav>
    <input type="file" id="fileInput" accept="application/json,.json" hidden>
  </div><!-- /phone -->
</div><!-- /stage -->

<script type="module" src="./src/app.js"></script>
</body>
</html>
