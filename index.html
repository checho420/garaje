/* ══════════════════════ API pública (llamada desde el HTML) ══════════════════════ */
const G={
  openForm(kind,a,b,c){
    if(kind==='vehicle') formVehicle(a||b);
    else if(kind==='event') formEvent(a, c||selectedId, b);
    else if(kind==='fixed') formFixed(c, b);
    else if(kind==='mileage') formMileage(a);
  },
  closeSheet(){ closeSheet(); },
  selectHome(id){ selectedId=id; renderHome(); },
  openDetail(id){ openVehDetail(id,'general'); },
  closeDetail(){ closeVehDetail(); },
  goDocsFor(id){ selectedId=id; goTab('s-docs'); },
  editEvent(vehId,eventId,type){ formEvent(type,vehId,eventId); },
  editFixed(vehId,fixedId){ formFixed(vehId,fixedId); },
  openCurrencySheet(){ openCurrencySheet(); },
  pickCurrency(code){ state.settings.currency=code; save(); closeSheet(); renderSettingsScreen(); toast('Moneda actualizada.'); },
  mileKey(k){
    let b=window._mileBuf||'';
    if(k==='del') b=b.slice(0,-1); else if(b.length<8) b+=k;
    window._mileBuf=b; document.getElementById('mileAmt').textContent = b? Number(b).toLocaleString(cur().locale) : '0';
  },
  saveMileage(vehId){
    const v=state.vehicles.find(x=>x.id===vehId); if(!v) return;
    const val=Number(window._mileBuf||0); if(val<=0){ toast('Ingresa un valor.','err'); return; }
    v.mileage=fromDistDisplay(val); save(); closeSheet(); toast('Kilometraje actualizado.'); refreshCurrent();
  },
  saveVehicle(id){
    const name=document.getElementById('f-name').value.trim();
    if(!name){ toast('Escribe un alias para el vehículo.','err'); return; }
    const stBtn=document.querySelector('#statusPick button.on');
    const iconBtn=document.querySelector('.icon-pick.on');
    const data={
      name, brand:document.getElementById('f-brand').value.trim(), model:document.getElementById('f-model').value.trim(),
      year:Number(document.getElementById('f-year').value)||null, plate:document.getElementById('f-plate').value.trim().toUpperCase(),
      mileage:fromDistDisplay(parseMoney(document.getElementById('f-mileage').value)),
      purchaseDate:document.getElementById('f-purchaseDate').value, purchaseCost:parseMoney(document.getElementById('f-purchaseCost').value),
      photo:document.getElementById('f-photo').value.trim(), notes:document.getElementById('f-notes').value.trim(),
      status: stBtn?stBtn.dataset.s:'owned', salePrice:parseMoney(document.getElementById('f-salePrice').value),
      icon: iconBtn?iconBtn.dataset.icon:'sedan',
    };
    if(id){ Object.assign(state.vehicles.find(x=>x.id===id),data); toast('Vehículo actualizado.'); }
    else { const nv={id:uid(),...data,events:[],fixed:[]}; state.vehicles.unshift(nv); selectedId=nv.id; toast('Vehículo agregado.'); }
    save(); closeSheet(); refreshCurrent();
  },
  confirmDeleteVehicle(id){
    const v=state.vehicles.find(x=>x.id===id);
    askConfirm('Eliminar vehículo',`¿Eliminar "${escapeHtml(v.name)}" y todos sus registros? No se puede deshacer.`,()=>{
      state.vehicles=state.vehicles.filter(x=>x.id!==id);
      if(selectedId===id) selectedId=state.vehicles[0]?state.vehicles[0].id:null;
      save(); closeSheet(); closeVehDetail(); goTab('s-cars'); toast('Vehículo eliminado.');
    });
  },
  saveEvent(type,vehId,eventId){
    const v=state.vehicles.find(x=>x.id===vehId); if(!v) return;
    let title = type==='document'?document.getElementById('f-docType').value : (type==='fuel'?'Tanqueo':document.getElementById('f-title').value.trim());
    const date=document.getElementById('f-date').value;
    if((type==='accessory'||type==='repair')&&!title){ toast('Escribe una descripción.','err'); return; }
    if(!date||!validDate(date)){ toast('Revisa la fecha.','err'); return; }
    const data={type,date,title,cost:parseMoney(document.getElementById('f-cost').value),notes:(document.getElementById('f-notes')||{}).value?.trim()||''};
    const mEl=document.getElementById('f-mileage')||document.getElementById('f-mileage2');
    if(mEl) data.mileage=fromDistDisplay(parseMoney(mEl.value))||null;
    const pEl=document.getElementById('f-provider'); if(pEl) data.provider=pEl.value.trim();
    if(type==='document'){ data.docType=title; data.expiry=document.getElementById('f-expiry').value; }
    if(type==='fuel'){
      const qty=parseFloat(String(document.getElementById('f-qty').value).replace(',','.'))||0;
      if(qty<=0){ toast('Ingresa la cantidad de combustible.','err'); return; }
      data.qty=qty; data.fuelUnit=document.getElementById('f-fuelUnit').value;
      const stEl=document.getElementById('f-station'); if(stEl) data.station=stEl.value.trim();
      if(data.mileage && data.mileage>(Number(v.mileage)||0)) v.mileage=data.mileage;
    }
    if(eventId){ Object.assign(v.events.find(e=>e.id===eventId),data); toast('Registro actualizado.'); }
    else { v.events.push({id:uid(),...data}); toast(`${CATS[type].singular} agregado.`); }
    save(); closeSheet(); refreshCurrent();
  },
  confirmDeleteEvent(vehId,eventId){
    askConfirm('Eliminar registro','¿Eliminar este registro? No se puede deshacer.',()=>{
      const v=state.vehicles.find(x=>x.id===vehId); v.events=v.events.filter(e=>e.id!==eventId);
      save(); closeSheet(); toast('Registro eliminado.'); refreshCurrent();
    });
  },
  saveFixed(vehId,fixedId){
    const v=state.vehicles.find(x=>x.id===vehId); if(!v) return; if(!v.fixed) v.fixed=[];
    const amount=parseMoney(document.getElementById('f-amount').value);
    if(amount<=0){ toast('Ingresa el valor mensual.','err'); return; }
    const data={concept:document.getElementById('f-concept').value,amount,since:document.getElementById('f-since').value};
    if(fixedId){ Object.assign(v.fixed.find(f=>f.id===fixedId),data); toast('Gasto fijo actualizado.'); }
    else { v.fixed.push({id:uid(),...data}); toast('Gasto fijo definido.'); }
    save(); closeSheet(); refreshCurrent();
  },
  confirmDeleteFixed(vehId,fixedId){
    askConfirm('Eliminar gasto fijo','Dejará de proyectarse cada mes.',()=>{
      const v=state.vehicles.find(x=>x.id===vehId); v.fixed=v.fixed.filter(f=>f.id!==fixedId);
      save(); closeSheet(); toast('Gasto fijo eliminado.'); refreshCurrent();
    });
  },
  applySale(vehId){
    const v=state.vehicles.find(x=>x.id===vehId); const r=estimateSale(v,saleOptsByVeh[vehId]||{});
    askConfirm('Poner en venta',`Se guardará ${money(r.meta)} como precio de venta y quedará marcado En venta.`,()=>{
      v.salePrice=r.meta; v.status='forsale'; save(); closeSheet(); toast('Vehículo puesto en venta.'); refreshCurrent();
    });
  },
  runConfirm(){ const cb=confirmCb; confirmCb=null; if(cb) cb(); },
  exportData(){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download=`garaje-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast('Datos exportados.');
  },
};
window.G=G;

function refreshCurrent(){
  if(currentTab==='s-inicio') renderHome();
  else if(currentTab==='s-docs') renderDocsScreen();
  else if(currentTab==='s-cars') renderCarsScreen();
  else if(currentTab==='s-set') renderSettingsScreen();
  if(!document.getElementById('s-vehdetail').hidden) renderVehDetail();
}

/* ---- importar JSON ---- */
document.getElementById('fileInput').onchange=(ev)=>{
  const file=ev.target.files[0]; ev.target.value=''; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    let imported; try{ imported=JSON.parse(reader.result); }catch(e){ toast('El archivo no es un JSON válido.','err'); return; }
    if(!imported||!Array.isArray(imported.vehicles)){ toast('El archivo no tiene el formato esperado.','err'); return; }
    askConfirm('Importar datos', `Se encontraron ${imported.vehicles.length} vehículo(s). Se fusionarán con tus datos actuales.`, ()=>{
      imported.vehicles.forEach(iv=>{
        const ex=state.vehicles.find(v=>v.id===iv.id);
        if(ex){ const evs=ex.events||[]; (iv.events||[]).forEach(ie=>{ if(!evs.find(e=>e.id===ie.id)) evs.push(ie); });
          const fx=ex.fixed||[]; (iv.fixed||[]).forEach(ifx=>{ if(!fx.find(f=>f.id===ifx.id)) fx.push(ifx); });
          Object.assign(ex,iv,{events:evs,fixed:fx}); }
        else state.vehicles.push(iv);
      });
      if(imported.settings) state.settings=Object.assign(state.settings,imported.settings);
      save(); closeSheet(); toast('Datos importados y fusionados.'); applyTheme(); goTab(currentTab);
    });
  };
  reader.readAsText(file);
};

/* ══════════════════════ INICIALIZACIÓN ══════════════════════ */
load();
applyTheme();
goTab('s-inicio');

/* ══════════════════════ REGISTRO DEL SERVICE WORKER (PWA) ══════════════════════ */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* si falla (p.ej. abierto como file://), la app sigue funcionando igual, solo sin caché offline */ });
  });
}
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  window._deferredInstall=e;
  bindInstallAction();
});
window.addEventListener('appinstalled',()=>{
  window._deferredInstall=null;
  const group=document.getElementById('installAppGroup');
  if(group) group.style.display='none';
  toast('Garaje quedó instalado en tu dispositivo.');
});

})();
